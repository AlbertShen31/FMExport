[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fm26-screenshot-exporter"
version = "0.1.0"
description = "macOS-first Football Manager 2026 screenshot OCR/stat parser — converts FM table screenshots to CSV, Excel, JSON, and more."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FMExport Contributors" }]
keywords = ["football-manager", "fm26", "ocr", "screenshot", "export", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "opencv-python>=4.9.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "pydantic>=2.6.0",
    "pytesseract>=0.3.10",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.6.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15.0.0"]
streamlit = ["streamlit>=1.32.0"]
easyocr = ["easyocr>=1.7.0"]
dev = [
    "pytest>=8.0.0",
    "pyarrow>=15.0.0",
]

[project.scripts]
fm26-ocr = "fm26_screenshot_exporter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["fm26_screenshot_exporter"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "profiles"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
